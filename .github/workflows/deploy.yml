name: Desplegar en GitHub Pages

# Se despliega en cada push a la rama de trabajo, y también se puede lanzar a
# mano desde la pestaña Actions (botón "Run workflow").
on:
  push:
    branches:
      - claude/app-bach-academic-org-qw10km
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llega un push mientras hay un despliegue en marcha, se cancela el
# anterior en vez de encolarlos: solo importa que quede publicado lo último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Compilar para GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
