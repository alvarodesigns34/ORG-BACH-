<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="description" content="Tareas, exámenes y notas en un solo sitio, con un asistente de IA que te organiza la semana. Gratis, sin cuenta y sin conexión." />
    <meta name="theme-color" content="#F2F2F7" />
    <title>Órbita · La app para organizar tus estudios</title>

    <!-- Compartir (Open Graph). %SITE_URL% lo pone vite.config.ts. -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Órbita" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Órbita · La app para organizar tus estudios" />
    <meta property="og:description" content="Tareas, exámenes y notas en un solo sitio, con un asistente que te organiza la semana. Gratis, sin cuenta y sin conexión." />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Órbita: un planeta de cristal con rutas de vuelo y el titular «Tu curso, en órbita»" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/icono.svg" type="image/svg+xml" />

    <!-- iOS no lee el manifest para esto: instalar en pantalla de inicio y
         quitar la barra de Safari necesita estas etiquetas suyas propias. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Órbita" />

    <style>
      /* El CSS llega con el JS. Sin esto, el script de tema pinta data-theme
         sobre un documento blanco hasta que carga el bundle. */
      html, body { background: #f2f2f7; color: #1d1d1f; }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #000; color: #f5f5f7; }
    </style>

    <script>
      // Aplica el tema antes del primer pintado para evitar el parpadeo blanco.
      (function () {
        try {
          var raw = localStorage.getItem('bachillerato-os:v1')
          var pref = raw ? (JSON.parse(raw).settings || {}).theme : 'system'
          var dark =
            pref === 'dark' ||
            ((!pref || pref === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#000000' : '#F2F2F7')
          // iOS (Añadir a pantalla de inicio) no siempre dispara el media
          // query display-mode; navigator.standalone sí. La clase marca el
          // modo app por si algún estilo lo necesita.
          if (navigator.standalone) {
            document.documentElement.classList.add('is-standalone')
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
