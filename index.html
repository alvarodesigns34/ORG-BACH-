<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Centro de control academico personal: tareas, examenes, notas y estudio en un solo sitio." />
    <meta name="theme-color" content="#F6F4F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
    <title>Bachillerato OS</title>

    <link rel="icon" href="/icono.svg" type="image/svg+xml" />

    <!-- iOS no lee el manifest para esto: instalar en pantalla de inicio y
         quitar la barra de Safari necesita estas etiquetas suyas propias. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bachillerato" />

    <link
      rel="preload"
      href="/fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      // Aplica el tema antes del primer pintado para evitar el parpadeo blanco.
      (function () {
        try {
          var raw = localStorage.getItem('bachillerato-os:v1')
          var pref = raw ? (JSON.parse(raw).settings || {}).theme : 'system'
          var dark =
            pref === 'dark' ||
            ((!pref || pref === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
